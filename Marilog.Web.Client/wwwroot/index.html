<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>

    <base href="/" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marilog</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preload" href="_content/MudBlazor/MudBlazor.min.css" as="style">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="_content/Marilog.Shared.UI/ui-framework.css" rel="stylesheet" />
    <link href="_content/Marilog.Shared.UI/app.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <div class="app-loading">
            <img src="_content/Marilog.Shared.UI/images/marilog-logo.svg" alt="Marilog" />
            <div class="app-loading-bar"><span></span></div>
        </div>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/scrollLock.js"></script>
    <script src="Bldialog.js"></script>
    <script>
        window.marilogDownload = {
            downloadBytes: function (fileName, contentType, bytes) {
                // bytes يصل كـ Base64 string من Blazor
                const byteCharacters = atob(bytes);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], { type: contentType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        };


        window.downloadFile = (fileName, contentType, bytes) => {
            const blob = new Blob(
                [bytes],
                { type: contentType }
            );

            const url = URL.createObjectURL(blob);

            const anchor = document.createElement("a");

            anchor.href = url;
            anchor.download = fileName;

            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();

            URL.revokeObjectURL(url);
        };
    </script>
    <script src="js/google-oauth.js"></script>
</body>
</html>
